[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"

# The source targets the 0.8.24 language level (`pragma solidity ^0.8.24`, no newer features).
# The compiler is pinned to 0.8.26 because the offline verifier does not carry a 0.8.24 binary
# and the protected launch-floor tests it adds carry an exact `pragma solidity 0.8.26`.
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "paris"
bytecode_hash = "none"

offline = true
ffi = false
fs_permissions = []

remappings = ["forge-std/=lib/forge-std/src/"]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = true

[fmt]
line_length = 120
